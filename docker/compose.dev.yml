services:
  server:
    image: doc-manager-crdt-server-dev:latest
    build:
      dockerfile: docker/Dockerfile.dev
    env_file:
      - ../.env
    volumes:
      - type: bind
        source: ..
        target: /workspace
        bind:
          create_host_path: false
      - node_modules_dev:/workspace/node_modules
    ports:
      - "127.0.0.1:1234:1234"
    develop:
      watch:
        - path: ../package.json
          action: rebuild
        - path: ../package-lock.json
          action: rebuild

volumes:
  node_modules_dev:
